name: ci
on: [push, pull_request]
jobs:
  agent:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      MONGO_URL: mongodb://localhost:27017   # runs the MongoDB half of the store contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - run: cd agent && python -m pytest -q
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [middleware, web, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: cd shared && npm install   # types-only devDependency the apps typecheck against
      - run: cd ${{ matrix.dir }} && npm ci && npx tsc --noEmit && npm test
      - if: matrix.dir == 'web'
        run: cd web && npm run build   # compiles Tailwind against the shared palette
