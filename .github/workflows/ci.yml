name: ci
on: [push, pull_request]
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agent/requirements.txt }
      - run: pip install -r agent/requirements.txt
      - run: cd agent && python -m pytest -q
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix: { dir: [middleware, web] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ${{ matrix.dir }}/package-lock.json }
      - run: cd ${{ matrix.dir }} && npm ci && npx tsc --noEmit && npm test
